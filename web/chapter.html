<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大声朗读 - Harry Potter Chapter 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Harry Potter and the Philosopher's Stone</h1>
        <h2>Chapter 1 · The Boy Who Lived</h2>
    </header>

    <div id="player-controls">
        <div class="control-group">
            <label for="speed-select">播放速度</label>
            <select id="speed-select">
                <option value="0.5">0.5x</option>
                <option value="0.75">0.75x</option>
                <option value="1" selected>1x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2x</option>
            </select>
        </div>
        <button id="continuous-btn" class="toggle-btn" aria-pressed="false">
            连续播放
        </button>
        <a href="chapters.html?book=hp1" class="back-link">← 返回章节目录</a>
    </div>

    <div id="loading">正在加载数据...</div>

    <main id="content"></main>

    <div id="float-play" class="hidden">
        <button id="float-btn">▶ 播放选中</button>
    </div>

    <audio id="audio" preload="none"></audio>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
